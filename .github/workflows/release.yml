name: Keystead client release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: keystead-client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: keystead-client
        run: xvfb-run --auto-servernum ./gradlew test --no-daemon --rerun-tasks
      - name: Check whitespace
        working-directory: keystead-client
        run: git diff --check

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: keystead-windows
            gradle: .\gradlew.bat
          - os: macos-latest
            artifact: keystead-macos
            gradle: ./gradlew
          - os: ubuntu-latest
            artifact: keystead-linux
            gradle: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: keystead-client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Windows native tray text
        if: runner.os == 'Windows'
        working-directory: keystead-client
        run: .\gradlew.bat test --tests top.focess.keystead.client.WindowsTrayTest --no-daemon
      - name: Package native distribution
        working-directory: keystead-client
        run: ${{ matrix.gradle }} packageDistributionForCurrentOS --no-daemon
      - name: Archive Windows portable application
        if: runner.os == 'Windows'
        working-directory: keystead-client
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Keystead -DestinationPath build/compose/binaries/Keystead-windows-portable.zip
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Publish installers and the complete portable ZIP. A standalone EXE from
          # the unpacked app-image is unusable without its runtime and dependencies.
          path: |
            keystead-client/build/compose/binaries/**/*.msi
            keystead-client/build/compose/binaries/**/*.dmg
            keystead-client/build/compose/binaries/**/*.deb
            keystead-client/build/compose/binaries/**/*.rpm
            keystead-client/build/compose/binaries/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
